name: Svelte Check

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - ".github/svelte-check-matcher.json"
      - "frontend/package.json"
      - "frontend/tsconfig.json"
      - "frontend/vite.config.ts"
  pull_request:
    branches: [main, breaking/**]
    paths:
      - "frontend/src/**"
      - ".github/svelte-check-matcher.json"
      - "frontend/package.json"
      - "frontend/tsconfig.json"
      - "frontend/vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  type-check:
    name: Run Svelte Check
    # Don't run on dependabot branches
    if: github.actor != 'dependabot[bot]'
    runs-on: depot-ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp -C frontend install --frozen-lockfile

      - name: Build Pocket ID Frontend
        run: vp -C frontend run build

      - name: Add svelte-check problem matcher
        run: echo "::add-matcher::.github/svelte-check-matcher.json"

      - name: Run svelte-check
        run: vp -C frontend run check
