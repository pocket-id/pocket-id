name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto uses conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  translations:
    name: Download translations
    uses: ./.github/workflows/crowdin-download.yml
    secrets:
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

  prepare:
    name: Prepare release
    needs: translations
    runs-on: depot-ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ui-tag: ${{ steps.ui-version.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}

    steps:
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases must be triggered from main."
            exit 1
          fi

      # Release from the translations commit because it may have been added on top of the triggering commit
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.translations.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup git-cliff
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: git-cliff@2.14.2

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(git cliff --bumped-version --unreleased --offline --bump "$BUMP")
          version=${version#v}
          if [[ "$version" == "$(cat .version)" ]]; then
            echo "No commits requiring a version bump; no release created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing release v$version from $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"

      # The UI package has its own version, bumped by the conventional commits that touched it since its last ui-v tag
      - name: Calculate next UI package version
        if: steps.version.outputs.tag != ''
        id: ui-version
        run: |
          last_tag=$(git describe --tags --abbrev=0 --match 'ui-v*' 2>/dev/null || true)
          if [[ -z "$last_tag" ]]; then
            # git-cliff can't derive a first version, so the first release uses the one in package.json
            version=$(jq -r .version packages/ui/package.json)
          else
            version=$(git cliff --bumped-version --unreleased --offline --tag-pattern '^ui-v' --include-path 'packages/ui/**')
            version=${version#ui-v}
            if [[ "ui-v$version" == "$last_tag" ]]; then
              echo "No UI package commits requiring a version bump; @pocket-id/ui is not published." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ui-v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing @pocket-id/ui $version." >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Vite+
        if: steps.version.outputs.tag != ''
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        if: steps.version.outputs.tag != ''
        run: vp install --frozen-lockfile

      - name: Update version and changelog
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UI_VERSION: ${{ steps.ui-version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$VERSION" > .version
          jq --arg version "$VERSION" '.version = $version' frontend/package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" frontend/package.json
          if [[ -n "$UI_VERSION" ]]; then
            jq --arg version "$UI_VERSION" '.version = $version' packages/ui/package.json > "$RUNNER_TEMP/package.json"
            mv "$RUNNER_TEMP/package.json" packages/ui/package.json
          fi
          vp fmt frontend/package.json packages/ui/package.json
          git cliff --prepend CHANGELOG.md --tag "$RELEASE_TAG" --unreleased

      - name: Create bot app token
        if: steps.version.outputs.tag != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and tag release
        if: steps.version.outputs.tag != ''
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          UI_TAG: ${{ steps.ui-version.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # Attribute the release commit to the app and authenticate the push with its installation token
          bot_name="$APP_SLUG[bot]"
          bot_id=$(gh api "users/$bot_name" --jq .id)
          git config user.name "Pocket ID Bot"
          git config user.email "$bot_id+$bot_name@users.noreply.github.com"
          gh auth setup-git

          git add .version frontend/package.json packages/ui/package.json CHANGELOG.md
          git commit -m "release: $VERSION"
          git tag "$RELEASE_TAG"
          refs=("refs/tags/$RELEASE_TAG")
          if [[ -n "$UI_TAG" ]]; then
            git tag "$UI_TAG"
            refs+=("refs/tags/$UI_TAG")
          fi

          # Publish all refs together so a concurrent main update cannot leave an orphaned release tag
          git push --atomic origin HEAD:refs/heads/main "${refs[@]}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and attest
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: depot-ubuntu-24.04-16
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Create bot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Reuse the draft when retrying a failed build
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::Release $RELEASE_TAG is already published."
              exit 1
            fi
          else
            awk '/^## v[0-9]/ { if (found) exit; found=1; next } found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.52.0

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        with:
          configure-docker: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --skip=validate --parallelism=4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}

      - name: Binary attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Container image attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: depot-ubuntu-latest

    steps:
      - name: Create bot app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published [$RELEASE_TAG](https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"

  publish-ui:
    name: Publish UI package
    needs: [prepare, publish]
    if: needs.prepare.outputs.ui-tag != ''
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read
      # Needed by npm trusted publishing and provenance
      id-token: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp -C packages/ui install --frozen-lockfile

      # pnpm applies the publishConfig exports that point at dist, and npm handles trusted publishing
      - name: Pack
        working-directory: packages/ui
        run: vp pm pack --out "$RUNNER_TEMP/ui.tgz"

      - name: Publish
        run: npm publish "$RUNNER_TEMP/ui.tgz" --access public --provenance
