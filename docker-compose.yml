services:
  pocket-id:
    image: pocketid/pocket-id:v3 # or ghcr.io/pocket-id/pocket-id:v3
    restart: unless-stopped
    env_file: .env
    ports:
      - 1411:1411
    volumes:
      - "pocket-id-data:/app/data"
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s

volumes:
  pocket-id-data:
